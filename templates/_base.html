<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --purple:      #7c3aed;
        --purple-light:#a78bfa;
        --purple-dim:  #4c1d95;
        --bg:          #0d0d0d;
        --surface:     #141414;
        --panel:       #1a1a1a;
        --border:      #2a2a2a;
        --text:        #e0e0e0;
        --muted:       #666;
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Roboto', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-size: 0.95rem;
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      input, select, textarea {
        font-family: 'Roboto', sans-serif;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 7px 10px;
        font-size: 0.875rem;
        outline: none;
        width: 100%;
        transition: border-color 0.15s;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--purple);
      }
      input::placeholder { color: var(--muted); }
      select option { background: var(--panel); }

      .btn {
        font-family: 'Roboto', sans-serif;
        font-size: 0.8rem;
        font-weight: 500;
        padding: 7px 16px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        display: inline-block;
        text-align: center;
        text-decoration: none;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .btn-primary {
        background: var(--purple);
        color: #fff;
      }
      .btn-primary:hover { background: #6d28d9; color: #fff; }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .btn-ghost:hover { border-color: var(--purple); color: var(--purple-light); }
      .btn-danger {
        background: transparent;
        border: 1px solid #7f1d1d;
        color: #f87171;
      }
      .btn-danger:hover { border-color: #f87171; }
      .btn-safe {
        background: transparent;
        border: 1px solid #14532d;
        color: #4ade80;
      }
      .btn-safe:hover { border-color: #4ade80; }

      .divider {
        height: 1px;
        background: var(--border);
        border: none;
        margin: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .form-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 5px;
      }
      .form-group { margin-bottom: 16px; }

      /* Table */
      .data-table { width: 100%; border-collapse: collapse; }
      .data-table th {
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        text-align: left;
        white-space: nowrap;
      }
      .data-table td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        vertical-align: middle;
      }
      .data-table tbody tr:hover { background: rgba(255,255,255,0.02); }
      .data-table tbody tr:last-child td { border-bottom: none; }

      .badge {
        font-size: 0.7rem;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 4px;
        display: inline-block;
      }
      .badge-midrange { background: rgba(26,107,58,0.2); border: 1px solid rgba(26,107,58,0.5); color: #4ade80; }
      .badge-aggro    { background: rgba(155,35,53,0.2); border: 1px solid rgba(155,35,53,0.5); color: #f87171; }
      .badge-controle { background: rgba(26,58,107,0.2); border: 1px solid rgba(26,58,107,0.5); color: #60a5fa; }
      .badge-combo    { background: rgba(74,42,107,0.2); border: 1px solid rgba(74,42,107,0.5); color: #c084fc; }

      .site-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    {% block conteudo %}
    {% endblock %}
  </body>
</html>
