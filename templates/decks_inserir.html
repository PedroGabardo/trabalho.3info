{% extends "_base.html" %}

{% block conteudo %}
<h1>jogos_inserir dos guri</h1>

{% if erro %}
<p>{{ erro }}</p>
{% endif %}

<form action="decks_inserir.php" method="post" enctype="multipart/form-data">
    <label for="comandante">Comandante:</label>
    <input type="text" name="nome" id="comandante" placeholder="Insira o Comandante">
    <br>
    <label for="link">Link da lista:</label>
    <input type="url" name="link" id="link" placeholder="Insira a URL">
    <br>
    <label for="standings">Standings:</label>
    <input type="text" name="standings" id="standings" placeholder="?/?/?">
    <br>
    <label for="posicao">Posição:</label>
    <input type="number" name="posicao" id="posicao" placeholder="Insira o número da posição">
    <br>
    <label for="arquetipo">Arquétipo:</label>
    <select name="arquetipo" id="arquetipo">
        <option value="midrange">Midrange</option>
        <option value="aggro">Aggro</option>
        <option value="controle">Controle</option>
        <option value="combo">Combo</option>
    </select>
    <br>
    <input type="submit" value="gravar">

</form>

{% endblock %}
